  <rect x="444" y="310" width="106" height="40" rx="8" fill="#FFFFFF"/>
  <text x="456" y="326" fill="#71717A" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Mar 18</text>
  <text x="456" y="342" fill="#111111" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800">$44,280</text>

