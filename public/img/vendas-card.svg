    <text x="712" y="332" fill="#D4D4D8" font-size="11.5" font-weight="500">Direct</text>
    <text x="852" y="332" text-anchor="end" fill="#FFFFFF" font-size="11.5" font-weight="700">54%</text>
    <rect x="712" y="341" width="140" height="7" rx="3.5" fill="#27272A"/>
    <rect x="712" y="341" width="104" height="7" rx="3.5" fill="#FFFFFF"/>

    <text x="712" y="382" fill="#D4D4D8" font-size="11.5" font-weight="500">Organic</text>
    <text x="852" y="382" text-anchor="end" fill="#FFFFFF" font-size="11.5" font-weight="700">29%</text>
    <rect x="712" y="391" width="140" height="7" rx="3.5" fill="#27272A"/>
    <rect x="712" y="391" width="66" height="7" rx="3.5" fill="#22C55E"/>

