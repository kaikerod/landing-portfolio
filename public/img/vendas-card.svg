  <path d="M216 456 C252 448, 268 418, 304 422 C340 426, 362 384, 398 378 C434 372, 462 396, 496 364 C530 332, 558 344, 590 328 C616 315, 636 320, 650 314 L650 482 L216 482 Z" fill="url(#areaFill)"/>
