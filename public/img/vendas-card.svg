<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141518"/>
      <stop offset="1" stop-color="#0C0D0F"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="305" x2="0" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="dashShadow" x="34" y="40" width="892" height="536" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Studio Canvas -->
  <rect width="960" height="600" fill="url(#dashBg)"/>

