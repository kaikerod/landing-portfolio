  <rect x="81" y="84" width="24" height="24" rx="7" fill="#FFFFFF"/>
  <path d="M88 100L93 92L97 96L100 90" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
