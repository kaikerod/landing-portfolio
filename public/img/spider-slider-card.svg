    <text x="88" y="426" fill="#71717A" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5">Earth-1610</text>
  </g>

  <!-- Right Peeking Card (02 - Spider-Gwen / Off-White Editorial) -->
  <g opacity="0.72">
    <rect x="678" y="142" width="218" height="316" rx="18" fill="#F4F3EF" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="702" y="176" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">02</text>
    <circle cx="787" cy="274" r="56" stroke="#111111" stroke-opacity="0.09" stroke-width="1.2"/>
    <circle cx="787" cy="274" r="34" stroke="#111111" stroke-opacity="0.09" stroke-width="1.2"/>
    <path d="M731 274H843M787 218V330M747 234L827 314M827 234L747 314" stroke="#111111" stroke-opacity="0.07" stroke-width="1.2"/>
    <path d="M752 268C760 257 773 260 779 272C769 277 758 275 752 268Z" fill="#111111"/>
    <path d="M822 268C814 257 801 260 795 272C805 277 816 275 822 268Z" fill="#111111"/>
