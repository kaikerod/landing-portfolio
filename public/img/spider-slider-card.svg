    <text x="702" y="426" fill="#52525B" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5">Earth-65</text>
  </g>

  <!-- Center Active Spotlight Card (01 - Peter Parker) -->
  <g filter="url(#heroCardShadow)">
    <rect x="326" y="100" width="308" height="392" rx="22" fill="url(#crimsonCard)"/>
    <rect x="326.5" y="100.5" width="307" height="391" rx="21.5" stroke="#FFFFFF" stroke-opacity="0.22"/>
  </g>

