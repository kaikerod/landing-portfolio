  <rect x="536" y="119" width="70" height="24" rx="12" fill="#111111" fill-opacity="0.35"/>
  <text x="571" y="135" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">616</text>

