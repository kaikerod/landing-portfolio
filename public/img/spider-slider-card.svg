  <rect x="348" y="380" width="264" height="88" rx="14" fill="#111111" fill-opacity="0.82"/>
  <text x="368" y="410" fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">Peter Parker</text>
  <text x="368" y="432" fill="#D4D4D8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12">Classic Suit · Interactive Slide</text>
  <circle cx="586" cy="424" r="16" fill="#FFFFFF"/>
  <path d="M582 428L590 420M583 420H590V427" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

