  <circle cx="294" cy="296" r="22" fill="#FFFFFF"/>
  <path d="M298 289L291 296L298 303" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="666" cy="296" r="22" fill="#FFFFFF"/>
  <path d="M662 289L669 296L662 303" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Editorial Progress Bar -->
  <text x="380" y="544" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">01</text>
  <rect x="408" y="538" width="144" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="408" y="538" width="52" height="4" rx="2" fill="#DC2626"/>
  <text x="564" y="544" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">03</text>
