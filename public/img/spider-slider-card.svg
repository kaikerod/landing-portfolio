<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17171A"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="crimsonCard" x1="330" y1="104" x2="630" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="heroCardShadow" x="296" y="84" width="368" height="444" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Editorial Dark Stage -->
  <rect width="960" height="600" fill="url(#stageBg)"/>

  <!-- Giant Subtle Editorial Watermark -->
