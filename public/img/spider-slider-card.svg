  <path d="M394 244C412 222 444 228 462 256C446 276 414 276 394 244Z" fill="#111111"/>
  <path d="M405 245C419 231 440 235 452 254C440 266 418 266 405 245Z" fill="#FFFFFF"/>

  <path d="M566 244C548 222 516 228 498 256C514 276 546 276 566 244Z" fill="#111111"/>
  <path d="M555 245C541 231 520 235 508 254C520 266 542 266 555 245Z" fill="#FFFFFF"/>

