    <circle cx="480" cy="264" r="82"/>
    <circle cx="480" cy="264" r="46"/>
    <path d="M362 264H598M480 146V382M396 180L564 348M564 180L396 348"/>
  </g>

  <!-- Top Row inside Active Card -->
